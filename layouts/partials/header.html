<header class=" py-4 mb-6">
    <div class="max-w-7xl mx-auto px-4 flex items-center justify-between">
        <a href="{{ .Site.Home.RelPermalink }}" class="text-xl font-bold text-blue-600 hover:underline">{{ .Site.Title }}</a>
    </div>
</header>{{ $parts := split .RelPermalink "/" }}
<nav class="text-sm text-gray-500 mb-4 space-x-1">
    <a href="{{ .Site.Home.RelPermalink }}" class="hover:underline">Home</a>
    {{ $path := "" }}
    {{ range $i, $p := $parts }}
    {{ if and (ne $p "") (lt $i (sub (len $parts) 1)) }}
    {{ $path = print $path "/" $p }}
    /
    <a href="{{ $path | relURL }}" class="hover:underline capitalize">{{ $p }}</a>
    {{ end }}
    {{ end }}
</nav>
