<!DOCTYPE html>
<html lang="en">
<head>
    {{ partial "head.html" . }}
</head>
<body class="site-body text-gray-900 font-sans">
{{ partial "header.html" . }}

{{ block "main" . }}{{ end }}

{{ partial "footer.html" . }}

{{ if .Site.Params.HugoFooter }}
<p style="text-align: center">
    Compiled with <a href="https://gohugo.io" class="font-bold text-blue-600 hover:underline">Hugo</a>,
    using the <a href="https://github.com/22decembre/Berenice" class="font-bold text-blue-600 hover:underline">Berenice theme</a>,
    by <a href="https://www.22decembre.eu/" class="font-bold text-blue-600 hover:underline">Stéphane 22Decembre</a>.
</p>

<br>
{{ end }}

<script src="{{ `lightgallery.min.js` | relURL }}"></script>
<script src="{{ `lg-zoom.min.js` | relURL }}"></script>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        // const panels = Array.from(document.querySelectorAll("[data-gallery-panel]"));
        const openButtons = Array.from(document.querySelectorAll("[data-open-gallery]"));
        const lightboxContainers = Array.from(document.querySelectorAll(".gallery-lightbox"));

        lightboxContainers.forEach((container) => {
            if (typeof lightGallery !== "function") {
                return;
            }

            lightGallery(container, {
                selector: ".gallery-lightbox-link",
                plugins: window.lgZoom ? [lgZoom] : [],
                speed: 500,
                download: false,
                zoom: true,
                actualSize: false,
                backdropDuration: 260,
            });
        });

        let activePanelName = "menu";
        let isSwitching = false;

        function getFloatingTransform(state, time) {
            const floatStartTime = state.floatStartTime || 0;
            const floatHold = state.floatHold || 0;
            const floatFadeIn = state.floatFadeIn || 1800;

            const floatElapsed = Math.max(time - floatStartTime - floatHold, 0);
            const floatProgress = Math.min(floatElapsed / floatFadeIn, 1);

            const easedProgress = floatProgress < 0.5
                ? 16 * Math.pow(floatProgress, 5)
                : 1 - Math.pow(-2 * floatProgress + 2, 5) / 2;

            const t = floatElapsed * state.speed + state.phase;

            const x = Math.sin(t) * state.amplitudeX * easedProgress;
            const y = Math.sin(t * 2) * state.amplitudeY * easedProgress;

            return `translate3d(${x}px, ${y}px, 0)`;
        }

        function getActivePanel() {
            return document.querySelector(`[data-gallery-panel="${activePanelName}"]`);
        }

        function getActivePanel() {
            return document.querySelector(`[data-gallery-panel="${activePanelName}"]`);
        }

        function getActiveCards() {
            const activePanel = getActivePanel();

            if (!activePanel) {
                return [];
            }

            return Array.from(activePanel.querySelectorAll(".floating-thumb"));
        }

        const floatingState = new WeakMap();

        function ensureFloatingState(card, index) {
            if (floatingState.has(card)) {
                return floatingState.get(card);
            }

            const state = {
                phase: index * 1.37,
                speed: 0.00045 + (index % 5) * 0.000035,
                amplitudeX: 3 + (index % 3),
                amplitudeY: 1.5 + (index % 2),
                isAnimating: false,
                floatStartTime: performance.now(),
                floatHold: 180,
                floatFadeIn: 1800,
            };

            floatingState.set(card, state);
            return state;
        }

        function resetFloating(card, index, time = performance.now()) {
            const state = ensureFloatingState(card, index);

            state.floatStartTime = time;
            state.floatHold = 220;
            state.floatFadeIn = 2200;

            card.style.transform = "translate3d(0, 0, 0)";
        }

        function getStaggerDelay(index, columns = 6) {
            const row = Math.floor(index / columns);
            const column = index % columns;

            return row * 115 + column * 72;
        }

        function animateFloatingCards(time) {
            getActiveCards().forEach((card, index) => {
                const state = ensureFloatingState(card, index);

                if (card.classList.contains("is-entering") || card.classList.contains("is-leaving")) {
                    state.floatStartTime = time;
                    card.style.transform = "translate3d(0, 0, 0)";
                    return;
                }

                card.style.transform = getFloatingTransform(state, time);
            });

            requestAnimationFrame(animateFloatingCards);
        }

        function animateOut(panel, direction = "left") {
            const cards = Array.from(panel.querySelectorAll(".floating-thumb"));
            const targetX = direction === "right" ? "95vw" : "-95vw";
            const panelHeader = panel.querySelector(".gallery-panel-header");

            if (panelHeader) {
                panelHeader.getAnimations().forEach((animation) => animation.cancel());

                panelHeader.style.opacity = "1";
                panelHeader.style.transform = "";
                panelHeader.style.filter = "";

                panelHeader.animate(
                    [
                        {
                            opacity: 1,
                            transform: "translate3d(0, 0, 0)",
                            filter: "blur(0)",
                        },
                        {
                            opacity: 0,
                            transform: "translate3d(0, -10px, 0)",
                            filter: "blur(2px)",
                        },
                    ],
                    {
                        duration: 220,
                        easing: "ease-out",
                        fill: "forwards",
                    }
                );
            }

            return Promise.all(cards.map((card, index) => {
                const flight = card.querySelector(".card-flight") || card;
                const directionY = index % 2 === 0 ? -28 : 28;
                const rotation = direction === "right"
                    ? (index % 2 === 0 ? 7 : -7)
                    : (index % 2 === 0 ? -7 : 7);
                const delay = Math.min(getStaggerDelay(index), 950);

                card.classList.add("is-leaving");

                return flight.animate(
                    [
                        {
                            transform: "translate3d(0, 0, 0) rotate(0deg)",
                            opacity: 1,
                            filter: "blur(0)",
                        },
                        {
                            transform: `translate3d(${targetX}, ${directionY}px, 0) rotate(${rotation}deg)`,
                            opacity: 0,
                            filter: "blur(2px)",
                        },
                    ],
                    {
                        duration: 2200,
                        delay,
                        easing: "cubic-bezier(0.45, 0, 0.15, 1)",
                        fill: "forwards",
                    }
                ).finished.then(() => {
                    card.classList.remove("is-leaving");
                });
            }));
        }

        function animateIn(panel, direction = "right") {
            const cards = Array.from(panel.querySelectorAll(".floating-thumb"));
            const startX = direction === "left" ? "-120vw" : "120vw";
            const panelHeader = panel.querySelector(".gallery-panel-header");

            if (panelHeader) {
                panelHeader.getAnimations().forEach((animation) => animation.cancel());

                panelHeader.style.opacity = "0";
                panelHeader.style.transform = "translate3d(0, -10px, 0)";
                panelHeader.style.filter = "blur(2px)";

                const headerAnimation = panelHeader.animate(
                    [
                        {
                            opacity: 0,
                            transform: "translate3d(0, -10px, 0)",
                            filter: "blur(2px)",
                        },
                        {
                            opacity: 1,
                            transform: "translate3d(0, 0, 0)",
                            filter: "blur(0)",
                        },
                    ],
                    {
                        duration: 360,
                        easing: "cubic-bezier(0.16, 1, 0.3, 1)",
                        fill: "forwards",
                    }
                );

                headerAnimation.finished.then(() => {
                    panelHeader.style.opacity = "1";
                    panelHeader.style.transform = "";
                    panelHeader.style.filter = "";

                    headerAnimation.cancel();
                });
            }

            return Promise.all(cards.map((card, index) => {
                const flight = card.querySelector(".card-flight") || card;
                const directionY = index % 2 === 0 ? -24 : 24;
                const rotation = direction === "left"
                    ? (index % 2 === 0 ? -8 : 8)
                    : (index % 2 === 0 ? 8 : -8);
                const delay = Math.min(getStaggerDelay(index), 1200);

                resetFloating(card, index);

                card.classList.add("is-entering");

                flight.style.opacity = "0";
                flight.style.filter = "blur(2px)";
                flight.style.transform = `translate3d(${startX}, ${directionY}px, 0) rotate(${rotation}deg)`;

                const animation = flight.animate(
                    [
                        {
                            transform: `translate3d(${startX}, ${directionY}px, 0) rotate(${rotation}deg)`,
                            opacity: 0,
                            filter: "blur(2px)",
                            offset: 0,
                        },
                        {
                            transform: "translate3d(0, 0, 0) rotate(0deg)",
                            opacity: 1,
                            filter: "blur(0)",
                            offset: 1,
                        },
                    ],
                    {
                        duration: 1500,
                        delay,
                        easing: "cubic-bezier(0.16, 1, 0.3, 1)",
                        fill: "forwards",
                    }
                );

                return animation.finished.then(() => {
                    flight.style.opacity = "1";
                    flight.style.filter = "blur(0)";
                    flight.style.transform = "translate3d(0, 0, 0) rotate(0deg)";

                    animation.cancel();

                    resetFloating(card, index);

                    requestAnimationFrame(() => {
                        flight.style.opacity = "";
                        flight.style.filter = "";
                        flight.style.transform = "";

                        card.classList.remove("is-entering");
                    });
                });
            }));
        }

        async function switchPanel(nextPanelName) {
            if (isSwitching || nextPanelName === activePanelName) {
                return;
            }

            const galleryStage = document.querySelector(".gallery-stage");
            const currentPanel = document.querySelector(`[data-gallery-panel="${activePanelName}"]`);
            const nextPanel = document.querySelector(`[data-gallery-panel="${nextPanelName}"]`);

            if (!currentPanel || !nextPanel) {
                return;
            }

            const isReturningToMenu = nextPanelName === "menu";

            isSwitching = true;

            if (galleryStage) {
                galleryStage.classList.add("is-switching");
            }

            nextPanel.classList.add("is-active");

            const outAnimation = animateOut(currentPanel, isReturningToMenu ? "right" : "left");
            const inAnimation = animateIn(nextPanel, isReturningToMenu ? "left" : "right");

            activePanelName = nextPanelName;

            await Promise.all([outAnimation, inAnimation]);

            currentPanel.classList.remove("is-active");

            if (galleryStage) {
                galleryStage.classList.remove("is-switching");
            }

            isSwitching = false;
        }

        openButtons.forEach((button) => {
            button.addEventListener("click", () => {
                switchPanel(button.dataset.openGallery);
            });
        });

        requestAnimationFrame(animateFloatingCards);
    });
</script>
</body>
</html>
