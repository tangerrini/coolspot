<!DOCTYPE html>
<html lang="en">
  <head>
    {{ partial "head.html" . }}
  </head>
  <body class="bg-white text-gray-900 font-sans">
    {{ partial "header.html" . }}

      {{ block "main" . }}{{ end }}

    {{ partial "footer.html" . }}

        {{ if .Site.Params.HugoFooter }}

       <p style="text-align: center">Compiled with <a href="http://gohugo.io"  class="font-bold text-blue-600 hover:underline">Hugo</a>, using the <a href="https://github.com/22decembre/Berenice" class="font-bold text-blue-600 hover:underline">Berenice theme</a>, by <a href="https://www.22decembre.eu/" class="font-bold text-blue-600 hover:underline">Stéphane 22Decembre</a>.
       </p>

       <br>

      {{ end }}

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const cards = document.querySelectorAll(".floating-thumb");

            cards.forEach((card) => {
                card.addEventListener("mousemove", (event) => {
                    const rect = card.getBoundingClientRect();

                    const x = event.clientX - rect.left - rect.width / 2;
                    const y = event.clientY - rect.top - rect.height / 2;

                    const strength = 0.12;

                    card.style.setProperty("--magnet-x", `${x * strength}px`);
                    card.style.setProperty("--magnet-y", `${y * strength}px`);
                    card.classList.add("is-magnetic");
                });

                card.addEventListener("mouseleave", () => {
                    card.style.setProperty("--magnet-x", "0px");
                    card.style.setProperty("--magnet-y", "0px");
                    card.classList.remove("is-magnetic");
                });
            });
        });
    </script>

  </body>
</html>
